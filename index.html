<!--
  ARCHITECTURE (même principe que Momox Dogs)
  - index.html    : le site (structure + design). On n'y touche pas.
  - content.json  : tous les textes, prix, photos, couleurs, réglages.
  - admin.html    : l'outil pour modifier content.json sans coder.
  - images/       : les photos et le logo.
  Le site se construit au chargement à partir de content.json.
-->
<style>
/* Polices hébergées sur le site (pas de Google Fonts : plus rapide, fonctionne hors ligne, sans souci RGPD) */
@font-face{font-family:"Saira"; font-style:italic; font-weight:100 900; font-stretch:50% 125%; font-display:swap; src:url(fonts/saira-italic.woff2) format("woff2")}
@font-face{font-family:"Saira"; font-style:normal; font-weight:100 900; font-stretch:50% 125%; font-display:swap; src:url(fonts/saira-italic.woff2) format("woff2")}
@font-face{font-family:"Barlow"; font-weight:400; font-display:swap; src:url(fonts/barlow-400.woff2) format("woff2")}
@font-face{font-family:"Barlow"; font-weight:500; font-display:swap; src:url(fonts/barlow-500.woff2) format("woff2")}
@font-face{font-family:"Barlow"; font-weight:600; font-display:swap; src:url(fonts/barlow-600.woff2) format("woff2")}
@font-face{font-family:"Barlow"; font-weight:700; font-display:swap; src:url(fonts/barlow-700.woff2) format("woff2")}
/* =========================================================
   TOKENS
   ========================================================= */
:root{
  --bg:#08090b; --surface:#111317; --surface2:#181b21; --ink:#f5f6f8; --muted:#9aa3ad;
  --accent:#e10a1e; --accent-hot:#ff3347; --line:#2a2f37;
  --accent-rgb:225,10,30; --ink-rgb:245,246,248; --bg-rgb:8,9,11;
  --font-display:"Saira","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --font-body:"Barlow","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --maxw:clamp(1360px, 62vw, 1640px); --gutter:clamp(1.25rem,4.2vw,3.5rem);
  --cut:.95rem; --header-h:4.75rem;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html{
  font-size:calc(clamp(16px, 16px + (100vw - 1920px) * .0025, 18px) * var(--fs,1));
  scroll-behavior:smooth; scroll-padding-top:calc(var(--header-h) + 1rem);
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-size:1rem; line-height:1.6; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body.lock{overflow:hidden}
img{max-width:100%; display:block}
a{color:inherit}
button{font:inherit; color:inherit}
p{margin:0 0 1em}
:focus-visible{outline:2px solid var(--accent-hot); outline-offset:3px; border-radius:2px}
::selection{background:var(--accent); color:var(--on-accent,#fff)}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.skip{position:absolute; left:1rem; top:-4rem; background:var(--accent); color:var(--on-accent,#fff); padding:.7rem 1rem; z-index:200; transition:top .2s}
.skip:focus{top:1rem}
.wrap{width:min(100% - 2*var(--gutter), var(--maxw)); margin-inline:auto}
.icon{width:1.25em; height:1.25em; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}

/* progression de "tour" en haut de page */
#lap{position:fixed; inset:0 0 auto 0; height:3px; z-index:120; background:linear-gradient(90deg,var(--accent),var(--accent-hot)); transform-origin:0 50%; transform:scaleX(0); pointer-events:none}

/* =========================================================
   TYPO
   ========================================================= */
.display{font-family:var(--font-display); font-style:var(--t-style,italic); font-weight:800; font-stretch:var(--t-stretch,118%); text-transform:var(--t-case,uppercase); letter-spacing:-.005em; line-height:1}
.h2{font-family:var(--font-display); font-style:var(--t-style,italic); font-weight:800; font-stretch:var(--t-stretch,115%); text-transform:var(--t-case,uppercase); font-size:clamp(1.75rem,1.1rem + 2vw,2.75rem); line-height:1.04; margin:0 0 1.1rem; hyphens:manual; overflow-wrap:anywhere; text-wrap:balance}
.lead{color:var(--muted); font-size:clamp(1rem,.92rem + .22vw,1.15rem); max-width:56ch; text-wrap:pretty}
.section{padding-block:calc(clamp(4.5rem,9vw,9rem) * var(--dens,1)); position:relative}
.sec-head{margin-bottom:clamp(2rem,4vw,3.5rem); max-width:62rem}

/* =========================================================
   BOUTONS (parallélogramme, façon livrée de course)
   ========================================================= */
.btn{
  --sk:.75rem;
  display:inline-flex; align-items:center; justify-content:center; gap:.65rem;
  min-height:3.25rem; padding:.8rem 2.1rem; border:0; cursor:pointer; text-decoration:none;
  font-family:var(--font-display); font-style:var(--t-style,italic); font-weight:700; font-stretch:var(--t-stretch,112%); font-size:1rem;
  text-transform:var(--t-case,uppercase); letter-spacing:.05em; color:var(--on-accent,#fff); background:var(--accent);
  clip-path:polygon(var(--sk) 0,100% 0,calc(100% - var(--sk)) 100%,0 100%);
  position:relative; isolation:isolate; transition:transform .25s var(--ease), filter .25s;
  -webkit-tap-highlight-color:transparent;
}
.btn::before{content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%); transform:translateX(-120%); transition:transform .7s var(--ease)}
.btn:hover::before{transform:translateX(120%)}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(1px)}
.btn-ghost{background:rgba(var(--ink-rgb),.08); box-shadow:none}
.btn-ghost:hover{background:rgba(var(--ink-rgb),.16)}
.btn-line{background:transparent; color:var(--ink)}
.btn-line::after{content:""; position:absolute; inset:0; z-index:-2; background:rgba(var(--ink-rgb),.28); clip-path:polygon(var(--sk) 0,100% 0,calc(100% - var(--sk)) 100%,0 100%)}
.btn-line span.in{position:absolute; inset:2px; background:var(--bg); z-index:-1; clip-path:polygon(calc(var(--sk) - .05rem) 0,100% 0,calc(100% - var(--sk) + .05rem) 100%,0 100%)}
.btn-sm{min-height:2.7rem; padding:.55rem 1.5rem; font-size:.9rem}
.btn[disabled]{opacity:.5; cursor:not-allowed}

/* coins coupés */
.cut{clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}

/* =========================================================
   HEADER
   ========================================================= */
.header{position:fixed; inset:0 0 auto 0; height:var(--header-h); z-index:100; display:flex; align-items:center; transition:background .35s, box-shadow .35s, backdrop-filter .35s; padding-top:env(safe-area-inset-top)}
.header::before{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(var(--bg-rgb),.85),transparent); pointer-events:none; transition:opacity .35s}
.header.is-stuck{background:rgba(var(--bg-rgb),.82); -webkit-backdrop-filter:blur(16px) saturate(1.3); backdrop-filter:blur(16px) saturate(1.3); box-shadow:0 1px 0 rgba(var(--ink-rgb),.08)}
.header.is-stuck::before{opacity:0}
.header-in{position:relative; display:flex; align-items:center; justify-content:space-between; gap:1.5rem; width:min(100% - 2*var(--gutter), var(--maxw)); margin-inline:auto}
.brand{display:flex; align-items:center; text-decoration:none}
.brand img{height:var(--logo-h,2.9rem); width:auto; max-width:60vw; object-fit:contain; transition:transform .4s var(--ease)}
.brand-txt,.foot-txt,#start .stxt{font-family:var(--font-display); font-style:var(--t-style,italic); font-weight:800; font-stretch:var(--t-stretch,118%); text-transform:var(--t-case,uppercase); letter-spacing:.02em; line-height:1; color:#fff; white-space:nowrap}
.brand-txt{font-size:calc(var(--logo-h,2.9rem)*.52)}
.foot-txt{display:inline-block; font-size:calc(var(--logo-h,2.9rem)*.6); margin-bottom:.9rem}
#start .stxt{font-size:clamp(1.8rem,8vw,3.2rem)}
#start .slogo,#start .stxt{opacity:0; transition:opacity .3s}
#start.logo-ready .slogo,#start.logo-ready .stxt{opacity:1}
.brand:hover img{transform:scale(1.04)}
.nav{display:flex; align-items:center; gap:clamp(1rem,2.2vw,2.2rem)}
.nav a.nl{position:relative; text-decoration:none; font-weight:600; font-size:.95rem; letter-spacing:.02em; color:rgba(var(--ink-rgb),.78); padding:.4rem 0; transition:color .2s}
.nav a.nl::after{content:""; position:absolute; left:0; right:0; bottom:-.1rem; height:2px; background:var(--accent); transform:scaleX(0); transform-origin:0 50%; transition:transform .3s var(--ease)}
.nav a.nl:hover,.nav a.nl.is-active{color:#fff}
.nav a.nl:hover::after,.nav a.nl.is-active::after{transform:scaleX(1)}
.burger{display:none; width:3rem; height:3rem; border:0; background:transparent; cursor:pointer; position:relative; z-index:130}
.burger span{position:absolute; left:.75rem; right:.75rem; height:2px; background:#fff; transition:transform .35s var(--ease), opacity .2s, top .35s var(--ease)}
.burger span:nth-child(1){top:1.1rem} .burger span:nth-child(2){top:1.47rem} .burger span:nth-child(3){top:1.84rem}
.burger[aria-expanded="true"] span:nth-child(1){top:1.47rem; transform:rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){opacity:0}
.burger[aria-expanded="true"] span:nth-child(3){top:1.47rem; transform:rotate(-45deg)}
.menu{position:fixed; inset:0; z-index:95; background:rgba(var(--bg-rgb),.97); display:flex; flex-direction:column; justify-content:center; padding:calc(var(--header-h) + 1rem) var(--gutter) 2rem; clip-path:inset(0 0 100% 0); visibility:hidden; transition:clip-path .55s var(--ease), visibility 0s .55s}
.menu.open{clip-path:inset(0); visibility:visible; transition:clip-path .55s var(--ease), visibility 0s}
.menu a.ml{font-family:var(--font-display); font-style:var(--t-style,italic); font-weight:800; font-stretch:var(--t-stretch,115%); text-transform:var(--t-case,uppercase); font-size:clamp(2rem,9vw,3.2rem); line-height:1.25; text-decoration:none; opacity:0; transform:translateX(-1.5rem); transition:opacity .4s, transform .5s var(--ease), color .2s}
.menu.open a.ml{opacity:1; transform:none; transition-delay:calc(.12s + var(--i) * .05s)}
.menu a.ml:hover{color:var(--accent-hot)}
.menu .btn{margin-top:2rem; align-self:flex-start}

/* =========================================================
   HERO
   ========================================================= */
.hero{position:relative; min-height:100svh; display:flex; flex-direction:column; justify-content:center; overflow:hidden; padding:calc(var(--header-h) + 2.2rem) 0 clamp(7.5rem,13vw,11.5rem); isolation:isolate}
.hero-studio{position:absolute; inset:0; z-index:-4; background:
  radial-gradient(55% 45% at 72% 82%, rgba(var(--accent-rgb),.30), transparent 70%),
  radial-gradient(38% 38% at 12% 8%, rgba(255,255,255,.07), transparent 70%),
  linear-gradient(180deg,#0c0d10 0%,var(--bg) 70%)}
.hero-studio::before,.hero-studio::after{content:""; position:absolute; top:-20%; bottom:-20%; width:16%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.055),transparent); transform:skewX(-24deg); animation:softbox 16s ease-in-out infinite alternate}
.hero-studio::before{left:38%}
.hero-studio::after{left:62%; width:7%; animation-duration:22s; animation-delay:-8s}
@keyframes softbox{from{translate:-6vw 0}to{translate:8vw 0}}
.hero-photo{position:absolute; inset:0; z-index:-3; width:100%; height:100%; object-fit:cover; opacity:0; animation:photoIn 1.6s .1s var(--ease) forwards}
@keyframes photoIn{from{opacity:0; transform:scale(1.08)}to{opacity:.55; transform:scale(1)}}
.hero-shade{position:absolute; inset:0; z-index:-2; background:linear-gradient(90deg,rgba(var(--bg-rgb),.92) 0%,rgba(var(--bg-rgb),.55) 55%,rgba(var(--bg-rgb),.2) 100%),linear-gradient(180deg,transparent 60%,var(--bg) 100%); pointer-events:none}
.hero-grain{position:absolute; inset:0; z-index:-1; opacity:var(--grain,.07); pointer-events:none; mix-blend-mode:overlay; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.hero-in{position:relative; z-index:2}
.hero h1{font-size:clamp(2.1rem,.9rem + 4vw,4.2rem); line-height:.97; margin:0 0 1.3rem; max-width:17ch; text-wrap:balance}
.hero h1 .w{display:inline-block; overflow:hidden; vertical-align:bottom; padding-right:.18em; margin-right:-.18em}
.hero h1 .w>span{display:inline-block; transform:translateY(105%); animation:wordUp .9s var(--ease) forwards; animation-delay:calc(.55s + var(--i) * .07s)}
@keyframes wordUp{to{transform:none}}
.hero .lead{font-size:clamp(1rem,.88rem + .3vw,1.15rem); color:rgba(var(--ink-rgb),.78); max-width:46ch; opacity:0; animation:fadeIn .9s 1.15s var(--ease) forwards}
.hero-cta{display:flex; flex-wrap:wrap; gap:1rem; margin-top:2rem; opacity:0; animation:fadeIn .9s 1.3s var(--ease) forwards}
.hero-points{list-style:none; padding:0; margin:2.4rem 0 0; display:flex; flex-wrap:wrap; gap:.8rem 2.2rem; opacity:0; animation:fadeIn .9s 1.45s var(--ease) forwards}
.hero-points li{display:flex; align-items:center; gap:.6rem; font-size:.95rem; color:rgba(var(--ink-rgb),.8)}
.hero-points .icon{color:var(--accent-hot)}
@keyframes fadeIn{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}

/* la voiture dans la pit lane */
.pit{position:absolute; left:0; right:0; bottom:0; height:clamp(7rem,15vw,13rem); z-index:1; pointer-events:none}
.pit-car{position:absolute; right:max(2.5vw,1rem); bottom:2.4rem; width:min(66vw,1100px); aspect-ratio:var(--car-ar,958/166); clip-path:inset(0 100% 0 0); animation:carReveal 1.5s .25s var(--ease) forwards}
@keyframes carReveal{to{clip-path:inset(0 0 0 0)}}
.pit-car img{width:100%; height:100%; opacity:.62; filter:drop-shadow(0 0 14px rgba(255,255,255,.12))}
.pit-car .gleam{position:absolute; inset:0; -webkit-mask:var(--car) center/100% 100% no-repeat; mask:var(--car) center/100% 100% no-repeat; background:linear-gradient(100deg,transparent 40%,#fff 49%,rgba(var(--accent-rgb),.95) 52%,transparent 60%) 140% 0/260% 100% no-repeat; animation:gleam 7s 2.2s ease-in-out infinite; filter:drop-shadow(0 0 10px rgba(var(--accent-rgb),.9))}
@keyframes gleam{0%{background-position:140% 0}38%,100%{background-position:-60% 0}}
.pit-floor{position:absolute; left:0; right:0; bottom:1.8rem; height:2px; background:linear-gradient(90deg,transparent,var(--accent) 30%,var(--accent-hot) 70%,transparent); box-shadow:0 0 24px 2px rgba(var(--accent-rgb),.55); transform:scaleX(0); animation:floorIn 1.3s .2s var(--ease) forwards}
@keyframes floorIn{to{transform:none}}
.checker{position:absolute; left:0; right:0; bottom:0; height:1.1rem; background:repeating-conic-gradient(#f5f6f8 0 25%,#08090b 0 50%) 0 0/2.2rem 2.2rem; opacity:.9; -webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent); mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.scroll-cue{position:absolute; left:50%; bottom:3.2rem; width:1.5rem; height:2.4rem; margin-left:-.75rem; border:2px solid rgba(var(--ink-rgb),.4); border-radius:1rem; z-index:3; opacity:0; animation:fadeIn 1s 2s forwards}
.scroll-cue::after{content:""; position:absolute; left:50%; top:.4rem; width:3px; height:.5rem; margin-left:-1.5px; background:#fff; border-radius:2px; animation:cue 1.8s infinite}
@keyframes cue{0%{opacity:0; transform:translateY(0)}30%{opacity:1}100%{opacity:0; transform:translateY(.9rem)}}

/* =========================================================
   PRESTATIONS
   ========================================================= */
.filters{display:flex; flex-wrap:wrap; gap:.6rem; margin:0 0 2rem}
.chip{border:1px solid rgba(var(--ink-rgb),.16); background:transparent; padding:.5rem 1.15rem; border-radius:99px; cursor:pointer; font-weight:600; font-size:.92rem; color:rgba(var(--ink-rgb),.8); transition:background .2s,border-color .2s,color .2s}
.chip:hover{border-color:rgba(var(--ink-rgb),.4)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent,#fff)}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,21rem),1fr)); gap:clamp(1rem,2vw,1.6rem); align-items:stretch}
.card{position:relative; display:flex; flex-direction:column; background:var(--surface); text-align:left; border:0; padding:0; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.07); transition:transform .45s var(--ease), box-shadow .3s; -webkit-tap-highlight-color:transparent}
.card:hover{transform:translateY(-4px); box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.55)}
.card-media{position:relative; aspect-ratio:16/11; overflow:hidden; background:var(--surface2)}
.card-media img{width:100%; height:100%; object-fit:cover; transition:transform .9s var(--ease)}
.card:hover .card-media img{transform:scale(1.06)}
.ph{position:absolute; inset:0; display:grid; place-items:center; background:
  radial-gradient(60% 80% at 80% 100%, rgba(var(--accent-rgb),var(--ph-a,.3)), transparent 70%),
  linear-gradient(var(--ph-r,135deg),#1b1e25,#0c0d10)}
.ph::before{content:""; position:absolute; top:-30%; bottom:-30%; left:-30%; width:30%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent); transform:skewX(-22deg); transition:left 1s var(--ease)}
.card:hover .ph::before{left:110%}
.ph .icon{width:3.6rem; height:3.6rem; stroke-width:1.2; color:rgba(var(--ink-rgb),.85); filter:drop-shadow(0 0 14px rgba(var(--accent-rgb),.55))}
.card-cat{position:absolute; left:0; top:1rem; background:rgba(var(--bg-rgb),.85); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); padding:.3rem .9rem .3rem 1rem; font-weight:600; font-size:.82rem; border-left:3px solid var(--accent)}
.card-pop{position:absolute; right:0; top:1rem; background:var(--accent); color:var(--on-accent,#fff); font-weight:700; font-size:.8rem; padding:.3rem 1rem .3rem .9rem; clip-path:polygon(.5rem 0,100% 0,100% 100%,0 100%)}
.card-body{display:flex; flex-direction:column; gap:.55rem; padding:1.4rem 1.5rem 1.5rem; flex:1}
.card{min-width:0}
.card h3{overflow-wrap:break-word; hyphens:auto; -webkit-hyphens:auto; margin:0; font-family:var(--font-display); font-style:var(--t-style,italic); font-weight:800; font-stretch:var(--t-stretch,112%); text-transform:var(--t-case,uppercase); font-size:1.35rem; line-height:1.1}
.card p.res{margin:0; color:var(--muted); font-size:.98rem; flex:1}
.card-foot{display:flex; align-items:flex-end; justify-content:space-between; gap:1rem; margin-top:.8rem; padding-top:1rem; border-top:1px solid rgba(var(--ink-rgb),.08)}
.price small{display:block; color:var(--muted); font-size:.78rem; line-height:1.1}
.price b{font-family:var(--font-display); font-style:var(--t-style,italic); font-weight:800; font-size:1.7rem; line-height:1.1}
.dur{display:flex; align-items:center; gap:.4rem; color:var(--muted); font-size:.9rem; white-space:nowrap}
.cards .card.hide{display:none}

/* =========================================================
   MODAL (dialog natif)
   ========================================================= */
dialog{border:0; padding:0; background:transparent; color:var(--ink); max-width:none; max-height:none}
dialog::backdrop{background:rgba(4,5,6,.78); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px)}
dialog[open]::backdrop{animation:fadeOnly .3s}
@keyframes fadeOnly{from{opacity:0}}
.sheet{position:fixed; top:0; right:0; bottom:0; width:min(100%,38rem); background:var(--surface); overflow-y:auto; overscroll-behavior:contain; box-shadow:-30px 0 80px rgba(0,0,0,.6); animation:sheetIn .5s var(--ease)}
@keyframes sheetIn{from{transform:translateX(100%)}}
dialog.closing .sheet{animation:sheetOut .28s ease-in forwards}
@keyframes sheetOut{to{transform:translateX(100%)}}
dialog.closing::backdrop{animation:fadeOut .28s forwards}
@keyframes fadeOut{to{opacity:0}}
.sheet-media{position:relative; aspect-ratio:16/10; background:var(--surface2); overflow:hidden}
.sheet-media img{width:100%; height:100%; object-fit:cover}
.sheet-body{padding:1.8rem 1.8rem 6rem}
.sheet h3{font-family:var(--font-display); font-style:var(--t-style,italic); font-weight:800; font-stretch:var(--t-stretch,115%); text-transform:var(--t-case,uppercase); font-size:clamp(1.7rem,3vw,2.3rem); line-height:1.05; margin:0 0 .6rem}
.sheet .meta{display:flex; flex-wrap:wrap; gap:.6rem 1.6rem; margin:1rem 0 1.4rem; padding:1rem 0; border-block:1px solid rgba(var(--ink-rgb),.1)}
.sheet .meta b{font-family:var(--font-display); font-style:var(--t-style,italic); font-weight:800; font-size:1.8rem}
.sheet ul.incl{list-style:none; padding:0; margin:1.5rem 0}
.sheet ul.incl li{display:flex; gap:.7rem; padding:.45rem 0; align-items:flex-start}
.sheet ul.incl .icon{color:var(--accent-hot); margin-top:.2rem}
.sheet-foot{position:sticky; bottom:0; padding:1rem 1.8rem calc(1rem + env(safe-area-inset-bottom)); background:linear-gradient(0deg,var(--surface) 70%,transparent)}
.x{position:absolute; top:1rem; right:1rem; z-index:5; width:2.8rem; height:2.8rem; border:0; background:rgba(var(--bg-rgb),.75); color:#fff; border-radius:50%; cursor:pointer; display:grid; place-items:center; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); transition:background .2s, transform .3s var(--ease)}
.x:hover{background:var(--accent); transform:rotate(90deg)}
.modal-c{position:fixed; inset:0; margin:auto; width:min(94vw,44rem); max-height:88vh; overflow:auto; background:var(--surface); padding:2.2rem; animation:popIn .4s var(--ease)}
@keyframes popIn{from{opacity:0; transform:translateY(20px) scale(.98)}}
dialog.closing .modal-c{animation:popOut .25s forwards}
@keyframes popOut{to{opacity:0; transform:translateY(10px)}}
.modal-c h3{font-family:var(--font-display); font-style:var(--t-style,italic); font-weight:800; text-transform:var(--t-case,uppercase); font-size:1.8rem; margin:0 0 1rem}

/* =========================================================
   AVANT / APRÈS
   ========================================================= */
.ba-wrap{display:grid; gap:1.2rem}
.ba{position:relative; --pos:50%; aspect-ratio:2/1; max-height:75vh; width:100%; background:#000; overflow:hidden; user-select:none; -webkit-user-select:none; box-shadow:0 30px 80px -20px rgba(0,0,0,.8), inset 0 0 0 1px rgba(var(--ink-rgb),.1)}
.ba img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none}
.ba .before{position:absolute; inset:0; clip-path:inset(0 calc(100% - var(--pos)) 0 0)}
.ba-range{position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:ew-resize; touch-action:pan-y; z-index:4; -webkit-appearance:none; appearance:none}
.ba-handle{position:absolute; top:0; bottom:0; left:var(--pos); width:3px; margin-left:-1.5px; background:#fff; z-index:3; pointer-events:none; box-shadow:0 0 18px rgba(0,0,0,.6)}
.ba-handle i{position:absolute; top:50%; left:50%; width:3.4rem; height:3.4rem; margin:-1.7rem 0 0 -1.7rem; background:var(--accent); border-radius:50%; display:grid; place-items:center; box-shadow:0 6px 24px rgba(0,0,0,.6); transition:transform .25s var(--ease)}
.ba:hover .ba-handle i{transform:scale(1.1)}
.ba-handle i svg{width:1.5rem; height:1.5rem; fill:none; stroke:#fff; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.ba-range:focus-visible + .ba-handle i{outline:3px solid #fff; outline-offset:3px}
.ba-tag{position:absolute; bottom:1rem; z-index:2; background:rgba(var(--bg-rgb),.8); padding:.3rem .9rem; font-weight:700; font-size:.85rem; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px)}
.ba-tag.l{left:1rem; border-left:3px solid var(--muted)} .ba-tag.r{right:1rem; border-right:3px solid var(--accent)}
.ba-cap{display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; color:var(--muted); font-size:.95rem}
.ba-thumbs{display:flex; gap:.7rem; flex-wrap:wrap}
.ba-thumbs button{border:0; padding:0; width:6.5rem; aspect-ratio:16/10; cursor:pointer; opacity:.55; background:#000; box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.2); transition:opacity .2s}
.ba-thumbs button img{width:100%; height:100%; object-fit:cover}
.ba-thumbs button[aria-current="true"]{opacity:1; outline:2px solid var(--accent); outline-offset:2px}

/* =========================================================
   MÉTHODE
   ========================================================= */
.carbon{background-color:color-mix(in srgb,var(--bg) 97%,var(--ink) 3%); background-image:linear-gradient(45deg,rgba(255,255,255,.025) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.025) 75%),linear-gradient(45deg,rgba(255,255,255,.025) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.025) 75%); background-size:8px 8px; background-position:0 0,4px 4px}
.methode{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:clamp(2rem,6vw,6rem); align-items:start}
.methode .sticky{position:sticky; top:calc(var(--header-h) + 2rem)}
.steps{list-style:none; margin:0; padding:0 0 0 clamp(2.4rem,5vw,4rem); position:relative; --p:0}
.steps::before{content:""; position:absolute; left:.55rem; top:.6rem; bottom:.6rem; width:2px; background:rgba(var(--ink-rgb),.12)}
.steps::after{content:""; position:absolute; left:.55rem; top:.6rem; bottom:.6rem; width:2px; background:linear-gradient(var(--accent-hot),var(--accent)); transform-origin:50% 0; transform:scaleY(var(--p)); box-shadow:0 0 14px rgba(var(--accent-rgb),.8)}
.step{position:relative; padding:0 0 clamp(2rem,4vw,3.4rem)}
.step:last-child{padding-bottom:0}
.step::before{content:""; position:absolute; left:calc(-1 * clamp(2.4rem,5vw,4rem) + .1rem); top:.55rem; width:1.1rem; height:1.1rem; border-radius:50%; background:var(--bg); border:2px solid rgba(var(--ink-rgb),.3); transition:background .4s, border-color .4s, box-shadow .4s}
.step.is-on::before{background:var(--accent); border-color:var(--accent-hot); box-shadow:0 0 0 5px rgba(var(--accent-rgb),.22)}
.step .n{font-family:var(--font-display); font-style:var(--t-style,italic); font-weight:800; font-stretch:var(--t-stretch,125%); font-size:clamp(2.4rem,4vw,3.4rem); line-height:1; color:transparent; -webkit-text-stroke:1.5px rgba(var(--ink-rgb),.35); transition:-webkit-text-stroke-color .4s, color .4s}
.step.is-on .n{-webkit-text-stroke-color:var(--accent-hot)}
.step h3{font-family:var(--font-display); font-style:var(--t-style,italic); font-weight:800; font-stretch:var(--t-stretch,112%); text-transform:var(--t-case,uppercase); font-size:clamp(1.3rem,2vw,1.7rem); margin:.2rem 0 .4rem}
.step p{color:var(--muted); max-width:46ch; margin:0}

/* =========================================================
   À PROPOS
   ========================================================= */
.about{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:clamp(2rem,6vw,6rem); align-items:center}
.portrait{position:relative; aspect-ratio:4/5; max-width:34rem; width:100%}
.portrait::before{content:""; position:absolute; inset:1.2rem -1.2rem -1.2rem 1.2rem; background:var(--accent); clip-path:polygon(0 0,calc(100% - 1.6rem) 0,100% 1.6rem,100% 100%,1.6rem 100%,0 calc(100% - 1.6rem)); opacity:.9}
.portrait .frame{position:absolute; inset:0; overflow:hidden; background:var(--surface2); clip-path:polygon(0 0,calc(100% - 1.6rem) 0,100% 1.6rem,100% 100%,1.6rem 100%,0 calc(100% - 1.6rem))}
.portrait img.p{width:100%; height:100%; object-fit:cover}
.portrait .ph{--ph-a:.35}
.portrait .big{font-family:var(--font-display); font-style:var(--t-style,italic); font-weight:900; font-stretch:var(--t-stretch,125%); font-size:clamp(7rem,16vw,12rem); line-height:1; color:rgba(var(--ink-rgb),.92); text-shadow:0 0 40px rgba(var(--accent-rgb),.7)}
.certif{display:flex; gap:1.1rem; align-items:center; margin:1.8rem 0 0; padding:1.1rem 1.4rem; max-width:40rem; background:linear-gradient(100deg,rgba(var(--accent-rgb),.18),rgba(var(--accent-rgb),.04)); box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.5)}
.certif .seal{flex:none; width:3.3rem; height:3.3rem; display:grid; place-items:center; background:var(--accent); color:var(--on-accent,#fff); border-radius:50%; box-shadow:0 0 22px rgba(var(--accent-rgb),.55)}
.certif .seal .icon{width:1.65rem; height:1.65rem}
.certif b{display:block; font-family:var(--font-display); font-style:var(--t-style,italic); font-weight:800; font-stretch:var(--t-stretch,112%); text-transform:var(--t-case,uppercase); font-size:1.15rem; line-height:1.15}
.certif span.d{display:block; margin-top:.25rem}
.certif small{display:block; color:var(--muted); margin-top:.3rem; font-size:.88rem; line-height:1.35}
.certif>div:last-child{min-width:0}
.certif b{overflow-wrap:anywhere}
@media (max-width:420px){ .certif{padding:.9rem 1rem; gap:.8rem} .certif .seal{width:2.6rem; height:2.6rem} .certif .seal .icon{width:1.3rem; height:1.3rem} .certif b{font-size:.98rem} }
.eng{list-style:none; padding:0; margin:1.8rem 0 0; display:grid; gap:.9rem}
.eng li{display:flex; gap:.9rem; align-items:flex-start; padding:1rem 1.2rem; background:var(--surface); box-shadow:inset 3px 0 0 var(--accent)}
.eng .icon{color:var(--accent-hot); margin-top:.15rem}

/* =========================================================
   GALERIE
   ========================================================= */
.masonry{columns:3 18rem; column-gap:1rem}
.masonry button{display:block; width:100%; padding:0; border:0; margin:0 0 1rem; break-inside:avoid; cursor:zoom-in; background:var(--surface); overflow:hidden; position:relative}
.masonry img{width:100%; height:auto; transition:transform .8s var(--ease), filter .4s}
.masonry button:hover img{transform:scale(1.05)}
.lb{position:fixed; inset:0; width:100%; height:100%; display:grid; place-items:center}
.lb img{max-width:92vw; max-height:84vh; object-fit:contain; animation:popIn .4s var(--ease)}
.lb .nav-b{position:absolute; top:50%; width:3.2rem; height:3.2rem; margin-top:-1.6rem; border:0; border-radius:50%; background:rgba(var(--bg-rgb),.75); cursor:pointer; display:grid; place-items:center; transition:background .2s}
.lb .nav-b:hover{background:var(--accent)}
.lb .prev{left:max(1rem,env(safe-area-inset-left))} .lb .next{right:max(1rem,env(safe-area-inset-right))}
.lb .cap{position:absolute; bottom:1.2rem; left:0; right:0; text-align:center; color:var(--muted); font-size:.95rem; padding:0 4rem}

/* =========================================================
   ZONE
   ========================================================= */
.zone{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:clamp(2rem,5vw,5rem); align-items:stretch}
.tags{display:flex; flex-wrap:wrap; gap:.5rem; list-style:none; padding:0; margin:1.6rem 0}
.tags li{padding:.35rem .9rem; font-size:.9rem; font-weight:500; background:var(--surface); box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.1)}
.tags li:first-child{box-shadow:inset 0 0 0 1px var(--accent); color:#fff}
.zone-note{color:var(--muted); font-size:.95rem}
.map-col{display:flex; flex-direction:column; gap:.8rem; min-width:0; min-height:26rem}
.map{position:relative; flex:1; min-height:24rem; background:var(--surface2); overflow:hidden; box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.1)}
/* fond d'attente opaque : on ne voit jamais le blanc de l'iframe qui charge */
.map::before{content:""; position:absolute; inset:0; z-index:1; background:radial-gradient(circle at 50% 42%,rgba(var(--accent-rgb),.14),transparent 60%),repeating-linear-gradient(100deg,rgba(var(--ink-rgb),.03) 0 40px,rgba(var(--ink-rgb),.06) 40px 80px),var(--surface2); transition:opacity .45s ease .1s}
.map.is-loaded::before{opacity:0; pointer-events:none}
.map iframe{position:absolute; inset:0; width:100%; height:100%; border:0; display:block; pointer-events:none}
.map.is-active iframe{pointer-events:auto}
.map-slow{position:absolute; inset:0; z-index:2; display:none; flex-direction:column; align-items:center; justify-content:center; gap:.8rem; text-align:center; padding:1rem; color:var(--muted)}
.map-slow p{margin:0}
.map.is-slow:not(.is-loaded) .map-slow{display:flex}
.map-hint{position:absolute; z-index:3; left:50%; bottom:1.1rem; transform:translateX(-50%); display:flex; align-items:center; gap:.5rem; padding:.55rem 1.05rem; border-radius:99px; border:1px solid rgba(var(--ink-rgb),.3); background:rgba(var(--bg-rgb),.82); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); font-weight:600; font-size:.85rem; white-space:nowrap; max-width:calc(100% - 1.6rem); cursor:pointer; transition:opacity .3s ease}
.map-hint span{overflow:hidden; text-overflow:ellipsis}
.map-hint .icon{width:1.1em; height:1.1em; color:var(--accent-hot); flex:none}
.map-hint:hover{border-color:var(--accent-hot)}
.map.is-active .map-hint{bottom:auto; top:.7rem; background:var(--accent); border-color:var(--accent); color:var(--on-accent,#fff)}
.map.is-active .map-hint .icon{color:#fff}
.map-link{align-self:flex-start}

/* =========================================================
   FAQ
   ========================================================= */
.faq{max-width:60rem}
.qa{border-bottom:1px solid rgba(var(--ink-rgb),.12)}
.qa:first-child{border-top:1px solid rgba(var(--ink-rgb),.12)}
.qa>button{display:flex; width:100%; align-items:center; justify-content:space-between; gap:1.5rem; padding:1.3rem 0; border:0; background:none; cursor:pointer; text-align:left; font-weight:600; font-size:clamp(1.05rem,1.5vw,1.25rem)}
.qa>button .icon{transition:transform .35s var(--ease); color:var(--accent-hot)}
.qa>button[aria-expanded="true"] .icon{transform:rotate(180deg)}
.qa .ans{display:grid; grid-template-rows:0fr; transition:grid-template-rows .4s var(--ease)}
.qa .ans>div{overflow:hidden}
.qa .ans p{margin:0 0 1.3rem; color:var(--muted); max-width:62ch}
.qa.open .ans{grid-template-rows:1fr}

/* =========================================================
   AVIS
   ========================================================= */
.reviews{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,20rem),1fr)); gap:1.2rem}
.rev{background:var(--surface); padding:1.6rem; box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.07); display:flex; flex-direction:column; gap:1rem}
.rev blockquote{margin:0; font-size:1.05rem}
.rev cite{font-style:normal; color:var(--muted); font-size:.92rem}
.rev cite b{color:var(--ink); display:block}

/* =========================================================
   CONTACT
   ========================================================= */
.contact{background:linear-gradient(180deg,var(--bg),#0d0e12)}
.contact-grid{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:clamp(2rem,6vw,6rem); align-items:start}
.channels{display:grid; gap:.8rem; margin-top:2rem}
.ch{display:flex; align-items:center; gap:1rem; padding:1rem 1.2rem; background:var(--surface); text-decoration:none; box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.08); transition:box-shadow .25s, transform .3s var(--ease)}
.ch:hover{box-shadow:inset 0 0 0 1px var(--accent); transform:translateX(4px)}
.ch .icon{color:var(--accent-hot); width:1.5rem; height:1.5rem}
.ch small{display:block; color:var(--muted); font-size:.82rem; line-height:1.2}
.ch b{font-weight:600; word-break:break-word}
.socials{display:flex; gap:.7rem; margin-top:1.4rem}
.socials a{width:3rem; height:3rem; display:grid; place-items:center; background:var(--surface); box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.1); transition:background .2s, transform .3s var(--ease)}
.socials a:hover{background:var(--accent); transform:translateY(-3px)}
form.q{background:var(--surface); padding:clamp(1.4rem,3vw,2.4rem); box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.08); display:grid; gap:1.1rem; grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.fld{display:grid; gap:.4rem; grid-column:span 1}
.fld.full{grid-column:1/-1}
.fld label{font-weight:600; font-size:.92rem}
.fld label i{font-style:normal; color:var(--accent-hot)}
.fld input,.fld select,.fld textarea{width:100%; font:inherit; font-size:1rem; color:var(--ink); background:#0b0c0f; border:1px solid rgba(var(--ink-rgb),.14); border-radius:0; padding:.85rem 1rem; min-height:3.1rem; transition:border-color .2s, box-shadow .2s}
.fld textarea{min-height:7.5rem; resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none; border-color:var(--accent-hot); box-shadow:0 0 0 3px rgba(var(--accent-rgb),.25)}
.fld .err{color:#ff7a86; font-size:.86rem; min-height:0}
.fld [aria-invalid="true"]{border-color:#ff5767}
.hp{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}
.form-actions{grid-column:1/-1; display:flex; flex-wrap:wrap; gap:1rem; align-items:center}
.form-note{grid-column:1/-1; color:var(--muted); font-size:.88rem; margin:0}
.form-ok{display:none; grid-column:1/-1; padding:1.2rem; background:rgba(40,160,90,.12); box-shadow:inset 3px 0 0 #2fb36a}
.form-ok.show{display:block}

/* =========================================================
   FOOTER + BARRE MOBILE
   ========================================================= */
.footer{padding:3.5rem 0 calc(2.5rem + env(safe-area-inset-bottom)); border-top:1px solid rgba(var(--ink-rgb),.08); position:relative}
.footer::before{content:""; position:absolute; left:0; right:0; top:-1px; height:1px; background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.foot-grid{display:flex; flex-wrap:wrap; justify-content:space-between; gap:2rem}
.foot-grid img{height:calc(var(--logo-h,2.9rem)*1.17); width:auto; max-width:100%; object-fit:contain; margin-bottom:.9rem}
.foot-grid p{color:var(--muted); max-width:34ch; margin:0}
.foot-links{display:flex; flex-wrap:wrap; gap:.4rem 1.6rem; list-style:none; padding:0; margin:0; align-content:flex-start}
.foot-links a,.linkbtn{color:rgba(var(--ink-rgb),.8); text-decoration:none; background:none; border:0; padding:.3rem 0; cursor:pointer; font-size:.95rem}
.foot-links a:hover,.linkbtn:hover{color:#fff; text-decoration:underline}
.copy{margin-top:2.4rem; padding-top:1.4rem; border-top:1px solid rgba(var(--ink-rgb),.08); color:var(--muted); font-size:.88rem; display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap}
.mbar{display:none}
@media (max-width:820px){
  .mbar{position:fixed; left:0; right:0; bottom:0; z-index:90; display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:1px; background:rgba(var(--ink-rgb),.12); padding-bottom:env(safe-area-inset-bottom); transform:translateY(110%); transition:transform .45s var(--ease)}
  .mbar.show{transform:none}
  .mbar a{display:flex; align-items:center; justify-content:center; gap:.5rem; min-height:3.4rem; background:rgba(var(--bg-rgb),.94); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); text-decoration:none; font-weight:700; font-size:.95rem}
  .mbar a.pri{background:var(--accent)}
  body.has-mbar{padding-bottom:3.6rem}
}

/* =========================================================
   REVEAL (une seule fois, discret)
   ========================================================= */
.rv{opacity:0; transform:translateY(16px); transition:opacity .7s var(--ease), transform .8s var(--ease); transition-delay:calc(var(--d,0) * 70ms)}
.rv.in{opacity:1; transform:none}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width:980px){
  .nav .nl,.nav .btn{display:none}
  .burger{display:block}
  .methode,.about,.zone,.contact-grid{grid-template-columns:1fr}
  .methode .sticky{position:static}
  .portrait{max-width:24rem}
  .map{min-height:22rem}
  .map-col{min-height:0}
}
@media (max-width:640px){
  :root{--header-h:4.1rem}
  .brand img{height:calc(var(--logo-h,2.9rem)*.83)}
  .hero{padding-top:calc(var(--header-h) + 2rem); padding-bottom:12rem}
  .hero h1{max-width:none}
  .hero-cta .btn{flex:1 1 100%}
  form.q{grid-template-columns:1fr}
  .fld{grid-column:1/-1}
  .sheet-body{padding:1.4rem 1.2rem 6rem}
  .sheet-foot{padding-inline:1.2rem}
  .ba-handle i{width:2.8rem; height:2.8rem; margin:-1.4rem 0 0 -1.4rem}
  .scroll-cue{display:none}
  .pit-car{right:-14vw; width:120vw}
}
@media (min-width:1700px){ .cards{grid-template-columns:repeat(3,minmax(0,1fr))} }
/* ---- ACCUEIL ADAPTÉ À LA HAUTEUR DISPONIBLE (portables, fenêtres basses) ---- */
@media (min-width:900px) and (max-height:820px){
  .hero{padding-top:calc(var(--header-h) + 1.2rem); padding-bottom:clamp(6.5rem,min(13vw,21vh),11.5rem)}
  .hero h1{max-width:28ch; font-size:clamp(2.1rem,min(.9rem + 4vw,7.4vh),4.2rem); margin-bottom:1rem}
  .hero .lead{max-width:62ch}
  .hero-cta{margin-top:1.3rem}
  .hero-points{margin-top:1.3rem}
  .pit{height:clamp(6rem,min(15vw,23vh),13rem)}
  .pit-car{width:min(66vw,1100px,calc(var(--car-ratio,5.77) * (clamp(6rem,min(15vw,23vh),13rem) - 2.8rem)))}
}
@media (max-height:520px) and (orientation:landscape){
  .hero{padding-top:calc(var(--header-h) + 1rem); padding-bottom:5rem}
  .hero h1{max-width:30ch}
  .pit{height:4rem} .pit-car{display:none}
}
/* mots très longs (saisis dans l'admin) : jamais de débordement horizontal */
h1,h2,h3,h4,p,li,dd,figcaption,blockquote,summary,.chip,.card-cat,.price b{overflow-wrap:anywhere}
.hero h1 .w{max-width:100%; white-space:normal; overflow-wrap:anywhere}
.hero h1 .w>span{max-width:100%}
.card,.qa>button,.rev,.tags li,.foot-links a,.ch b,.seg label,.seg span,.est>div{min-width:0; max-width:100%}
.qa>button>span{flex:1; min-width:0; overflow-wrap:anywhere}
.seg span,.seg small,.ch b,.ch small,.tags li,.sheet li span,label,option{overflow-wrap:anywhere}
/* =====================================================================
   DESIGN : tout est piloté par des variables et des attributs posés depuis l'admin.
   Aucun n'est défini par défaut : sans réglage, l'aspect d'origine est strictement conservé.
   ===================================================================== */
.btn.btn-ghost{color:var(--ink)}
html[data-btn="carre"] .btn{--sk:0rem}
html[data-btn="arrondi"] .btn,html[data-btn="pilule"] .btn{clip-path:none; border-radius:var(--r,.7rem)}
html[data-btn="pilule"] .btn{border-radius:99px}
html[data-btn="arrondi"] .btn-line::after,html[data-btn="pilule"] .btn-line::after{clip-path:none; border-radius:inherit}
html[data-btn="arrondi"] .btn-line span.in{clip-path:none; border-radius:calc(var(--r,.7rem) - 2px)}
html[data-btn="pilule"] .btn-line span.in{clip-path:none; border-radius:99px}
html[data-card="arrondi"] .cut{clip-path:none; border-radius:var(--r,.9rem)}
html[data-card="carre"] .cut{clip-path:none; border-radius:0}
html[data-card="arrondi"] .card{overflow:hidden}
html[data-hdr="plein"] .header{background:rgba(var(--bg-rgb),.96); box-shadow:0 1px 0 rgba(var(--ink-rgb),.08)} html[data-hdr="plein"] .header::before{opacity:0}
html[data-hdr="verre"] .header{background:rgba(var(--bg-rgb),.42); -webkit-backdrop-filter:blur(18px) saturate(1.4); backdrop-filter:blur(18px) saturate(1.4); box-shadow:0 1px 0 rgba(var(--ink-rgb),.1)} html[data-hdr="verre"] .header::before{opacity:0}
html[data-hdr="discret"] .header::before{opacity:0}
html[data-hero="centre"] .hero-in{text-align:center}
html[data-hero="centre"] .hero h1,html[data-hero="centre"] .hero .lead{margin-inline:auto}
html[data-hero="centre"] .hero-cta,html[data-hero="centre"] .hero-points{justify-content:center}
html[data-bg="uni"] .carbon{background-image:none}
html[data-bg="points"] .carbon{background-image:radial-gradient(rgba(var(--ink-rgb),.08) 1px,transparent 1.3px); background-size:18px 18px; background-position:0 0}
html[data-bg="lignes"] .carbon{background-image:repeating-linear-gradient(135deg,rgba(var(--ink-rgb),.04) 0 2px,transparent 2px 14px); background-size:auto}
html[data-bg="grille"] .carbon{background-image:linear-gradient(rgba(var(--ink-rgb),.05) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--ink-rgb),.05) 1px,transparent 1px); background-size:34px 34px; background-position:0 0}
html[data-motion="calme"] .rv{transform:none; transition-duration:.4s}
html[data-motion="calme"] .hero-studio::before,html[data-motion="calme"] .hero-studio::after{animation:none}
html[data-motion="aucun"] *,html[data-motion="aucun"] *::before,html[data-motion="aucun"] *::after{animation-duration:.01ms!important; animation-delay:0s!important; transition-duration:.01ms!important}
html[data-motion="aucun"] .rv{opacity:1; transform:none}
html[data-motion="aucun"] .hero h1 .w>span{transform:none} html[data-motion="aucun"] .hero .lead,html[data-motion="aucun"] .hero-cta,html[data-motion="aucun"] .hero-points{opacity:1}
html[data-motion="aucun"] .pit-car{clip-path:none} html[data-motion="aucun"] .pit-floor{transform:none} html[data-motion="aucun"] .hero-photo{opacity:.55}
/* thème CLAIR : fond clair détecté automatiquement ; le logo et la silhouette (traits blancs) sont inversés pour rester lisibles */
html[data-tone="clair"] .brand img,html[data-tone="clair"] .foot-grid img,html[data-tone="clair"] #start .slogo{filter:invert(1) hue-rotate(180deg)}
html[data-tone="clair"] .pit-car img,html[data-tone="clair"] .dx-car>img{filter:invert(1) hue-rotate(180deg)}
html[data-tone="clair"] .grime,html[data-tone="clair"] .hero-sweep,html[data-tone="clair"] .polish-hint{display:none}   /* la peinture « sale » à polir est conçue pour un fond sombre */
.hero h1 .w{padding-block:.08em; margin-block:-.08em}   /* les polices à empattements ont des jambages plus longs : ne pas les rogner */
html[data-tone="clair"] .hero-studio{background:radial-gradient(55% 45% at 72% 82%,rgba(var(--accent-rgb),.2),transparent 70%),radial-gradient(38% 38% at 12% 8%,rgba(var(--accent-rgb),.08),transparent 70%),var(--bg)}
html[data-tone="clair"] .hero-studio::before,html[data-tone="clair"] .hero-studio::after{background:linear-gradient(90deg,transparent,rgba(var(--ink-rgb),.05),transparent)}
html[data-tone="clair"] .ph{background:radial-gradient(60% 80% at 80% 100%,rgba(var(--accent-rgb),.2),transparent 70%),linear-gradient(135deg,var(--surface2),var(--bg))}
html[data-tone="clair"] .nav a.nl:hover,html[data-tone="clair"] .nav a.nl.is-active,html[data-tone="clair"] .foot-links a:hover,html[data-tone="clair"] .linkbtn:hover,html[data-tone="clair"] .brand-txt,html[data-tone="clair"] .foot-txt,html[data-tone="clair"] #start .stxt,html[data-tone="clair"] .tags li:first-child{color:var(--ink)}
html[data-tone="clair"] .burger span{background:var(--ink)}
html[data-tone="clair"] #start{background:var(--bg)}
html[data-tone="clair"] .card-cat{color:var(--ink)}
html[data-tone="clair"] .checker{opacity:.7}
/* modules ajoutables */
.annonce{position:relative; z-index:102; display:flex; align-items:center; justify-content:center; gap:.4rem .9rem; flex-wrap:wrap; padding:.6rem 3.2rem .6rem 1rem; text-align:center; font-weight:600; font-size:.92rem; background:var(--accent); color:var(--on-accent,#fff)}
.annonce.sombre{background:var(--surface2); color:var(--ink)} .annonce.clair{background:var(--ink); color:var(--bg)}
.annonce a{color:inherit; text-decoration:underline; text-underline-offset:.2em; font-weight:700}
.annonce button{position:absolute; right:.4rem; top:50%; transform:translateY(-50%); width:2.4rem; height:2.4rem; background:none; border:0; color:inherit; cursor:pointer; font-size:1.15rem; opacity:.8}
.annonce button:hover{opacity:1}
.header{top:var(--ann-off,0px)}
.atouts-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr)); gap:clamp(1rem,2vw,1.6rem)}
.atout{padding:1.7rem; background:var(--surface); box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.08); transition:transform .4s var(--ease), box-shadow .3s}
.atout:hover{transform:translateY(-4px); box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.5)}
.atout .seal2{width:3.2rem; height:3.2rem; display:grid; place-items:center; border-radius:50%; background:rgba(var(--accent-rgb),.16); color:var(--accent-hot); margin-bottom:1rem}
.atout .seal2 .icon{width:1.6rem; height:1.6rem}
.atout h3{margin:0 0 .4rem; font-family:var(--font-display); font-style:var(--t-style,italic); font-weight:800; font-stretch:var(--t-stretch,112%); text-transform:var(--t-case,uppercase); font-size:1.25rem; line-height:1.1}
.atout p{margin:0; color:var(--muted)}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr)); gap:clamp(1.2rem,3vw,2.4rem); text-align:center}
.stat b{display:block; font-family:var(--font-display); font-style:var(--t-style,italic); font-weight:800; font-stretch:var(--t-stretch,118%); font-size:clamp(2.4rem,5vw,4rem); line-height:1; color:var(--accent-hot); font-variant-numeric:tabular-nums}
.stat span{display:block; margin-top:.5rem; color:var(--muted)}
.cta-band{text-align:center; padding:clamp(2.2rem,5vw,4rem) clamp(1.2rem,4vw,3rem); background:linear-gradient(120deg,rgba(var(--accent-rgb),.22),rgba(var(--accent-rgb),.05)); box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.45)}
.cta-band .h2{margin-bottom:.8rem} .cta-band p{margin:0 auto 1.6rem; max-width:52ch; color:var(--muted)}
.bloc{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:clamp(1.5rem,5vw,4rem); align-items:center}
.bloc.solo{grid-template-columns:minmax(0,1fr); max-width:52rem; margin-inline:auto} .bloc.droite .bloc-img{order:2}
.bloc-img img{width:100%; aspect-ratio:4/3; object-fit:cover; display:block}
.bloc.cite{grid-template-columns:minmax(0,1fr); max-width:58rem; margin-inline:auto; text-align:center}
.bloc.cite blockquote{margin:0; font-family:var(--font-display); font-style:var(--t-style,italic); font-weight:700; font-size:clamp(1.5rem,3.2vw,2.4rem); line-height:1.25}
.bloc.cite cite{display:block; margin-top:1rem; color:var(--muted); font-style:normal}
.bloc .btn{margin-top:.4rem}
@media (max-width:820px){ .bloc{grid-template-columns:minmax(0,1fr)} .bloc.droite .bloc-img{order:0} }
/* aperçu en direct du studio : pas d'animation d'entrée (le site se redessine à chaque réglage) */
html[data-preview] .hero h1 .w>span{transform:none; animation:none}
html[data-preview] .hero .lead,html[data-preview] .hero-cta,html[data-preview] .hero-points{opacity:1; animation:none}
html[data-preview] .pit-car{clip-path:none; animation:none} html[data-preview] .pit-floor{transform:none; animation:none}
html[data-preview] .hero-photo{opacity:.55; animation:none} html[data-preview] .rv{opacity:1; transform:none; transition:none}
/* modules : jamais de débordement, même avec des textes démesurés */
.bloc,.bloc.cite>*,.bloc blockquote,.bloc cite,.stat,.stat b,.stat span,.atout,.atout h3,.atout p,.bloc>div,.bloc-img,.cta-band,.cta-band p,.annonce span,.annonce a{min-width:0; max-width:100%; overflow-wrap:anywhere}
.btn{max-width:100%; text-align:center; overflow-wrap:anywhere}
.cta-band .btn,.bloc .btn{white-space:normal}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important; animation-delay:0s!important; transition-duration:.01ms!important}
  .hero h1 .w>span{transform:none} .hero .lead,.hero-cta,.hero-points,.scroll-cue{opacity:1}
  .pit-car{clip-path:none} .pit-floor{transform:none} .hero-photo{opacity:.55}
  .rv{opacity:1; transform:none}
}

/* =========================================================
   V2 : INTRO FEUX DE DÉPART
   ========================================================= */
html.pre body{overflow:hidden}
#start{position:fixed; inset:0; z-index:400; background:radial-gradient(60% 50% at 50% 58%,#1c0a0e,#050607 72%); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.4rem; clip-path:inset(0); transition:clip-path .85s var(--ease); cursor:pointer}
#start.lift{clip-path:inset(0 0 100% 0); pointer-events:none}
#start .slogo{width:min(54vw,17rem); height:auto}
#start .gan{display:flex; gap:clamp(.5rem,2.4vw,1.2rem); padding:clamp(.9rem,3vw,1.5rem) clamp(1.1rem,3.5vw,2rem); background:#0e1013; border-radius:1.2rem; box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 80px #000}
#start .lt{display:block; width:clamp(2.3rem,9vw,4.2rem); aspect-ratio:1; border-radius:50%; background:#190b0e; box-shadow:inset 0 0 0 3px #000, inset 0 -6px 12px rgba(0,0,0,.6)}
#start .lt.on{background:radial-gradient(circle at 40% 32%,#ff8b95,#e10a1e 55%,#7d0610); box-shadow:inset 0 0 0 3px #000,0 0 44px 10px rgba(225,10,30,.6)}
#start.out .lt{background:#190b0e; box-shadow:inset 0 0 0 3px #000}
#start .sk{position:absolute; bottom:max(1.6rem,env(safe-area-inset-bottom)); margin:0; font-size:.85rem; color:rgba(245,246,248,.45)}
html.pre .hero h1 .w>span, html.pre .hero .lead, html.pre .hero-cta, html.pre .hero-points, html.pre .pit-car, html.pre .pit-floor, html.pre .hero-photo, html.pre .pit-car .gleam{animation-play-state:paused}

/* =========================================================
   V2 : HERO (essuyage, parallaxe, disponibilité)
   ========================================================= */
.hero{--sy:0}
.hero-in{translate:0 calc(var(--sy) * -.06px); opacity:calc(1 - var(--sy) / 1100)}
.pit-car{translate:calc(var(--sy) * .22px) 0}
.grime{position:absolute; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none; transition:opacity 1.4s ease}
.grime.gone{opacity:0}
.polish-hint{position:absolute; right:var(--gutter); top:42%; z-index:3; display:flex; align-items:center; gap:.6rem; padding:.55rem 1.15rem .55rem .9rem; background:rgba(var(--bg-rgb),.74); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); border-radius:99px; box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.16); font-size:.9rem; font-weight:600; opacity:0; transform:translateY(8px); transition:opacity .5s, transform .5s var(--ease); pointer-events:none}
.polish-hint.show{opacity:1; transform:none}
.polish-hint .icon{color:var(--accent-hot); animation:wipe 1.8s ease-in-out infinite}
@keyframes wipe{50%{transform:translateX(.3rem) rotate(-16deg)}}
.hero-sweep{position:absolute; inset:-10% -30%; z-index:1; pointer-events:none; opacity:0; background:linear-gradient(100deg,transparent 42%,rgba(255,255,255,.14) 49%,rgba(255,255,255,.36) 50%,rgba(var(--accent-rgb),.28) 52%,transparent 58%)}
.hero.polished .hero-sweep{animation:sweepX 1.7s var(--ease) forwards}
@keyframes sweepX{0%{opacity:0; transform:translateX(-60%)}12%,88%{opacity:1}100%{opacity:0; transform:translateX(60%)}}
.avail{display:inline-flex; align-items:center; gap:.6rem; margin:0 0 1.2rem; padding:.4rem .95rem; border-radius:99px; background:rgba(47,214,138,.1); box-shadow:inset 0 0 0 1px rgba(47,214,138,.38); font-weight:600; font-size:.9rem}
.avail i{width:.55rem; height:.55rem; border-radius:50%; background:#2fd68a; animation:live 2s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(47,214,138,.65)}70%,100%{box-shadow:0 0 0 .6rem rgba(47,214,138,0)}}

/* =========================================================
   V2 : BANDEAU DÉFILANT
   ========================================================= */
.marq-wrap{overflow:hidden; padding:1.6rem 0 1.2rem; position:relative; z-index:4}
.marq{background:var(--accent); color:var(--on-accent,#fff); padding:.8rem 0; transform:rotate(-1.1deg) scale(1.03); box-shadow:0 18px 50px rgba(var(--accent-rgb),.32)}
.marq-in{display:flex; width:max-content; animation:marq 42s linear infinite}
.marq:hover .marq-in{animation-play-state:paused}
.marq span{display:flex; align-items:center; white-space:nowrap; font-family:var(--font-display); font-style:var(--t-style,italic); font-weight:800; font-stretch:var(--t-stretch,118%); text-transform:var(--t-case,uppercase); font-size:clamp(1.05rem,2vw,1.6rem); line-height:1; letter-spacing:.02em}
.marq span::after{content:""; flex:none; width:.55em; height:.55em; margin:0 clamp(1.2rem,3vw,2.4rem); background:repeating-conic-gradient(#fff 0 25%,#08090b 0 50%) 0 0/.55em .55em}
@keyframes marq{to{transform:translateX(-50%)}}

/* =========================================================
   V2 : DÉTAILS DE LA VOITURE (zones interactives)
   ========================================================= */
.dx{display:grid; gap:clamp(1.4rem,3vw,2.4rem)}
.dx-car{position:relative; width:min(100%,1100px); margin-inline:auto; aspect-ratio:var(--car-ar,958/166)}
.dx-car>img{position:absolute; inset:0; width:100%; height:100%; filter:drop-shadow(0 0 22px rgba(255,255,255,.12))}
.dx-car .scan{position:absolute; inset:0; -webkit-mask:var(--car,url(images/car-lines.png)) center/100% 100% no-repeat; mask:var(--car,url(images/car-lines.png)) center/100% 100% no-repeat; background:linear-gradient(100deg,transparent 44%,#fff 49%,var(--accent-hot) 52%,transparent 58%) 140% 0/260% 100% no-repeat; animation:scan 6s ease-in-out infinite; filter:drop-shadow(0 0 12px rgba(var(--accent-rgb),.9))}
@keyframes scan{0%{background-position:140% 0}42%,100%{background-position:-60% 0}}
.hot{position:absolute; width:3rem; height:3rem; margin:-1.5rem 0 0 -1.5rem; padding:0; border:0; background:transparent; cursor:pointer; z-index:2; -webkit-tap-highlight-color:transparent}
.hot i{position:absolute; inset:1rem; border-radius:50%; background:var(--accent); box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 18px rgba(var(--accent-rgb),.9); transition:transform .3s var(--ease), background .2s}
.hot::after{content:""; position:absolute; inset:.85rem; border-radius:50%; border:2px solid var(--accent-hot); animation:ping 2.4s infinite}
.hot:hover i,.hot[aria-pressed="true"] i{transform:scale(1.4); background:#fff}
.hot[aria-pressed="true"]::after{border-color:#fff}
.dx-tabs{display:flex; flex-wrap:wrap; gap:.6rem; justify-content:center}
.dx-card{max-width:48rem; margin-inline:auto; text-align:center; min-height:10.5rem}
.dx-card h3{font-family:var(--font-display); font-style:var(--t-style,italic); font-weight:800; font-stretch:var(--t-stretch,115%); text-transform:var(--t-case,uppercase); font-size:clamp(1.35rem,2.2vw,1.9rem); margin:0 0 .7rem}
.dx-card p{color:var(--muted); margin:0 auto 1.3rem; max-width:54ch}
.dx-card .swap{animation:swapIn .55s var(--ease)}
@keyframes swapIn{from{opacity:0; transform:translateY(12px)}}

/* =========================================================
   V2 : MÉTHODE (tête de course), RAIL, CURSEUR, CARTES
   ========================================================= */
.stepswrap{position:relative}
.stepswrap .head{position:absolute; left:.55rem; top:calc(.6rem + (100% - 1.2rem) * var(--p,0)); width:1.1rem; height:1.1rem; margin:-.55rem 0 0 -.55rem; border-radius:50%; background:#fff; box-shadow:0 0 0 4px rgba(var(--accent-rgb),.4),0 0 26px 4px rgba(var(--accent-rgb),.9); transition:width .3s var(--ease),height .3s var(--ease),margin .3s var(--ease),border-radius .3s}
.stepswrap .head.done{width:2rem; height:2rem; margin:-1rem 0 0 -1rem; border-radius:.25rem; background:repeating-conic-gradient(#fff 0 25%,#08090b 0 50%) 0 0/.5rem .5rem}
.rail{position:fixed; right:1.05rem; top:50%; translate:0 -50%; z-index:80; display:none; flex-direction:column; gap:.1rem}
@media (min-width:1100px) and (hover:hover){.rail{display:flex}}
.rail a{position:relative; display:flex; align-items:center; justify-content:flex-end; gap:.7rem; height:1.7rem; min-width:1.4rem; text-decoration:none}
.rail a i{width:.6rem; height:.6rem; border-radius:50%; background:rgba(var(--ink-rgb),.28); transition:transform .3s var(--ease),background .3s,box-shadow .3s}
.rail a .lb{position:absolute; right:1.5rem; font-size:.78rem; font-weight:600; white-space:nowrap; background:rgba(var(--bg-rgb),.9); padding:.15rem .65rem; border-radius:.3rem; opacity:0; transform:translateX(6px); transition:opacity .25s,transform .3s var(--ease); pointer-events:none}
.rail a:hover .lb,.rail a:focus-visible .lb{opacity:1; transform:none}
.rail a.past i{background:#2fd68a}
.rail a.on i{background:var(--accent-hot); transform:scale(1.7); box-shadow:0 0 14px rgba(var(--accent-rgb),.95)}
.cur{position:fixed; left:0; top:0; width:2.6rem; height:2.6rem; margin:-1.3rem 0 0 -1.3rem; border:1.5px solid rgba(255,255,255,.5); border-radius:50%; pointer-events:none; z-index:500; opacity:0; will-change:transform; transition:width .25s var(--ease),height .25s var(--ease),margin .25s var(--ease),background .25s,border-color .25s,opacity .3s}
.cur.on{opacity:1}
.cur.hot{width:4.2rem; height:4.2rem; margin:-2.1rem 0 0 -2.1rem; background:rgba(var(--accent-rgb),.16); border-color:var(--accent-hot)}
.cur.down{width:1.7rem; height:1.7rem; margin:-.85rem 0 0 -.85rem}
.cur::after{content:""; position:absolute; left:50%; top:50%; width:5px; height:5px; margin:-2.5px; border-radius:50%; background:var(--accent-hot)}
.card::after{content:""; position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .3s; background:radial-gradient(20rem circle at var(--mx,50%) var(--my,50%),rgba(var(--accent-rgb),.17),transparent 62%)}
.card:hover::after{opacity:1}
.h2 .w{display:inline-block; overflow:hidden; vertical-align:bottom; padding:.06em .14em .1em 0; margin:-.06em -.14em -.1em 0}
.h2 .w>span{display:inline-block; transform:translateY(112%); transition:transform .85s var(--ease); transition-delay:calc(var(--i) * 55ms)}
.h2.in .w>span{transform:none}

/* =========================================================
   V2 : ESTIMATEUR + FORMULAIRE
   ========================================================= */
.est{grid-column:1/-1; display:grid; gap:1.2rem; padding:clamp(1rem,2.4vw,1.5rem); background:#0b0c0f; box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.1)}
.est h4{margin:0 0 .55rem; font-weight:700; font-size:.95rem}
.seg{display:flex; flex-wrap:wrap; gap:.5rem}
.seg label{position:relative; display:block}
.seg input{position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:pointer}
.seg span{display:block; padding:.55rem 1rem; border:1px solid rgba(var(--ink-rgb),.2); font-weight:600; font-size:.92rem; line-height:1.25; transition:background .2s,border-color .2s,transform .2s var(--ease)}
.seg span small{display:block; font-weight:500; opacity:.7; font-size:.78rem}
.seg label:hover span{border-color:rgba(var(--ink-rgb),.5)}
.seg input:checked + span{background:var(--accent); border-color:var(--accent); color:var(--on-accent,#fff)}
.seg input:focus-visible + span{outline:2px solid var(--accent-hot); outline-offset:2px}
.est-out{display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:.7rem 1.6rem; padding-top:1.1rem; border-top:1px solid rgba(var(--ink-rgb),.1)}

function initStats(){
  const els = $$('.stat b[data-count]'); if (!els.length) return;
  const run = el => { const raw = el.dataset.count, m = /^(\D*)(\d+(?:[.,]\d+)?)(.*)$/.exec(raw); if (!m || reduceMotion){ return; }
    const dec = (m[2].split(/[.,]/)[1] || '').length, sep = m[2].indexOf(',') >= 0 ? ',' : '.', target = parseFloat(m[2].replace(',', '.')), suf = el.textContent.slice(raw.length), t0 = performance.now(), dur = 1300;
    const fmt = v => v.toFixed(dec).replace('.', sep);
    const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = m[1] + fmt(target * e) + m[3] + suf; if (k < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); };
  if (!('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ io.unobserve(e.target); run(e.target); } }), { threshold:.4 }); els.forEach(e => io.observe(e));
}

function demoPanel(mode){
  // Rend un panneau de peinture noire sous éclairage de studio : micro-rayures en "swirls" (avant) ou miroir net (après)
  const W = 1280, H = 720, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
  let s = mode === 'before' ? 7 : 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const base = g.createLinearGradient(0, 0, W, H); base.addColorStop(0, '#0b0e14'); base.addColorStop(.5, '#10141c'); base.addColorStop(1, '#07090d'); g.fillStyle = base; g.fillRect(0, 0, W, H);
  // reflets des barres lumineuses
  const bars = [[.12,.16,.0],[.34,.10,.0],[.62,.20,.0],[.84,.08,.0]];
  g.save(); g.translate(W/2, H/2); g.rotate(-.35); g.translate(-W/2, -H/2);
  bars.forEach(([x,w]) => { const gx = x * W * 1.3 - W * .15, gw = w * W; const gr = g.createLinearGradient(gx, 0, gx + gw, 0);
    const a = mode === 'before' ? .22 : .9; gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.12, 'rgba(235,245,255,' + a + ')'); gr.addColorStop(.88, 'rgba(235,245,255,' + a + ')'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    if (mode === 'before') g.filter = 'blur(26px)'; g.fillStyle = gr; g.fillRect(gx, -H, gw, H * 3); g.filter = 'none'; });
  g.restore();
  // horizon rouge de la pit lane
  const hz = g.createLinearGradient(0, H * .7, 0, H); hz.addColorStop(0, 'rgba(225,10,30,0)'); hz.addColorStop(1, 'rgba(225,10,30,' + (mode === 'before' ? .16 : .45) + ')'); g.fillStyle = hz; g.fillRect(0, H * .7, W, H * .3);
  if (mode === 'before'){
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 2600; i++){ const cx = rnd() * W, cy = rnd() * H, r = 14 + rnd() * 120, a0 = rnd() * 6.28, len = .6 + rnd() * 1.8;
      g.strokeStyle = 'rgba(210,225,245,' + (.025 + rnd() * .075) + ')'; g.lineWidth = .6 + rnd() * .9; g.beginPath(); g.arc(cx, cy, r, a0, a0 + len); g.stroke(); }
    g.globalCompositeOperation = 'source-over'; g.fillStyle = 'rgba(150,165,185,.09)'; g.fillRect(0, 0, W, H);
  } else {
    const sh = g.createLinearGradient(0, 0, 0, H); sh.addColorStop(0, 'rgba(255,255,255,.07)'); sh.addColorStop(.5, 'rgba(255,255,255,0)'); g.fillStyle = sh; g.fillRect(0, 0, W, H);
  }
  const vg = g.createRadialGradient(W/2, H/2, H*.3, W/2, H/2, W*.7); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);
  return cv.toDataURL('image/jpeg', .86);
}

/* =====================================================================
   CARTE : embed Google Maps public (sans clé), comme sur Momox Dogs.
   Verrouillée tant qu'on ne l'a pas touchée, pour ne pas gêner le défilement.
   ===================================================================== */
function initMap(){
  const box = $('#map'), frame = $('#mapFrame'); if (!box || !frame) return;
  const Z = C.zone || {}, c = Z.centre || {};
  const q = str(c.label).trim() || (c.lat + ',' + c.lng);
  const r = parseFloat(Z.rayonKm) || 15, zoom = r > 30 ? 9 : r > 14 ? 10 : 11;
  const url = bust => 'https://www.google.com/maps?q=' + encodeURIComponent(q) + '&z=' + zoom + '&output=embed' + (bust ? '&_=' + Date.now() : '');
  let timer = null;
  /* Le fond d'attente reste affiché tant que Google n'a pas réellement répondu : jamais de cadre vide.
     Si la réponse tarde, un message propose de recharger la carte. */
  frame.addEventListener('load', () => { if (!frame.getAttribute('src')) return; clearTimeout(timer); box.classList.remove('is-slow'); box.classList.add('is-loaded'); });
  const start = bust => { clearTimeout(timer); box.classList.remove('is-loaded', 'is-slow'); timer = setTimeout(() => { if (!box.classList.contains('is-loaded')) box.classList.add('is-slow'); }, 9000); frame.src = url(bust); };
  if ('IntersectionObserver' in window){ const io = new IntersectionObserver(es => { if (es[0].isIntersecting){ io.disconnect(); start(); } }, { rootMargin:'700px 0px' }); io.observe(box); } else start();
  const retry = $('#mapRetry'); if (retry) retry.addEventListener('click', () => start(true));
  /* Carte verrouillée par défaut : seul le bouton la déverrouille (un simple contact en défilant ne fait rien).
     Elle se reverrouille toute seule dès qu'on touche ailleurs, qu'on quitte la zone ou qu'on appuie sur Échap. */
  const hint = $('#mapHint'), label = $('span', hint);
  const setLock = on => { box.classList.toggle('is-active', !on); hint.setAttribute('aria-pressed', String(!on)); label.textContent = on ? (isTouch ? 'Toucher pour interagir avec la carte' : 'Cliquer pour interagir avec la carte') : 'Verrouiller la carte pour faire défiler la page'; };
  setLock(true);
  hint.addEventListener('click', () => setLock(box.classList.contains('is-active')));
  document.addEventListener('pointerdown', e => { if (box.classList.contains('is-active') && !box.contains(e.target)) setLock(true); }, true);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && box.classList.contains('is-active')) setLock(true); });
  if ('IntersectionObserver' in window) new IntersectionObserver(es => { if (!es[0].isIntersecting && box.classList.contains('is-active')) setLock(true); }, { threshold:.15 }).observe(box);
}

function buildForm(ci){
  const form = $('#quote'); if (!form) return;
  const actions = $('#formActions'); const endpoint = safeUrl(ci.ct.formEndpoint);
  const E = estCfg(); const services = arr(C.services).filter(s => s && s.visible !== false);
  const state = { size: Math.min(1, E.tailles.length - 1), etat: 0, sel: new Set() };
  let shown = 0, raf = null;
  const fmt = n => Math.round(n).toLocaleString('fr-FR') + '\u00a0€';
  const FKEY = 'pl_form'; const FIELDS = ['nom','telephone','email','commune','vehicule','date','moment','message'];

  // ----- brouillon du formulaire (si la personne revient plus tard) -----
  try { const d = JSON.parse(sessionStorage.getItem(FKEY) || 'null'); if (d) FIELDS.forEach(k => { if (d[k] && form.elements[k]) form.elements[k].value = d[k]; }); } catch(e){}
  const saveDraft = () => { try { const d = {}; FIELDS.forEach(k => { if (form.elements[k]) d[k] = form.elements[k].value; }); sessionStorage.setItem(FKEY, JSON.stringify(d)); } catch(e){} };

  // ----- estimation -----
  function compute(){
    const sc = +E.tailles[state.size].coef, ec = +E.etats[state.etat].coef; let total = 0, unknown = 0; const lines = [];
    Array.from(state.sel).sort((a, b) => a - b).forEach(i => { const s = services[i]; if (!s) return; const b = priceNum(s.prix);
      if (isNaN(b)){ unknown++; lines.push(s.titre + ' (sur devis)'); } else { const v = Math.round(b * sc * ec / 5) * 5; total += v; lines.push(s.titre + ' : ' + fmt(v)); } });
    return { total, unknown, lines };
  }
  function tween(to){
    const out = $('#estN'); if (!out) return; cancelAnimationFrame(raf);
    if (reduceMotion){ shown = to; out.textContent = fmt(to); return; }
    const from = shown, t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / 480), e = 1 - Math.pow(1 - k, 3); shown = from + (to - from) * e; out.textContent = fmt(shown); if (k < 1) raf = requestAnimationFrame(step); else shown = to; };
    raf = requestAnimationFrame(step);
  }
  function update(){
    if (!E.actif) return;
    const r = compute(); const n = $('#estN'), d = $('#estD');
    if (!state.sel.size){ cancelAnimationFrame(raf); shown = 0; n.textContent = '—'; d.textContent = 'Choisissez une prestation pour voir une estimation.'; $('#h-prestations').value = ''; $('#h-est').value = ''; }
    else {
      if (r.total > 0) tween(r.total); else { cancelAnimationFrame(raf); shown = 0; n.textContent = 'Sur devis'; }
      d.textContent = r.lines.join(' · ') + (r.unknown && r.total ? ' · + sur devis' : '') + '. ' + E.note;
      $('#h-prestations').value = r.lines.join(' | '); $('#h-est').value = r.total ? 'environ ' + fmt(r.total) : 'sur devis';
    }
    $('#h-taille').value = E.tailles[state.size].label; $('#h-etat').value = E.etats[state.etat].label;
  }
  if (E.actif){
    $('#est').addEventListener('change', e => { const t = e.target;
      if (t.name === 'taille') state.size = +t.value; else if (t.name === 'etat') state.etat = +t.value;
      else if (t.name === 'svc'){ t.checked ? state.sel.add(+t.value) : state.sel.delete(+t.value); }
      update(); });
  } else {
    const sel = $('#f-presta'); sel.addEventListener('change', () => { state.sel.clear(); const i = services.findIndex(s => s.titre === sel.value); if (i >= 0) state.sel.add(i); });
  }
  SELECT_SERVICE = title => { const i = services.findIndex(s => s.titre === title); if (i < 0) return;
    if (E.actif){ const cb = $('#est input[name="svc"][value="' + i + '"]'); if (cb && !cb.checked){ cb.checked = true; state.sel.add(i); update(); } }
    else { const sel = $('#f-presta'); if (sel){ sel.value = title; state.sel.clear(); state.sel.add(i); } } };

  // ----- actions d'envoi -----
  if (endpoint) actions.innerHTML = `<button class="btn" type="submit">Envoyer ma demande</button>`;
  else {
    const b = [];
    if (ci.wa) b.push(`<button class="btn" type="button" data-send="wa">${ic('whatsapp')}Envoyer par WhatsApp</button>`);
    if (ci.email) b.push(`<button class="btn ${ci.wa ? 'btn-ghost' : ''}" type="button" data-send="mail">${ic('mail')}Envoyer par e-mail</button>`);
    if (!b.length) b.push(`<span class="zone-note">Les moyens de contact seront bientôt disponibles.</span>`);
    actions.innerHTML = b.join('');
  }
  const val = () => { let ok = true; const set = (id, msg) => { const el = $('#' + id); const err = el.parentElement.querySelector('.err'); err.textContent = msg || ''; el.setAttribute('aria-invalid', msg ? 'true' : 'false'); if (msg) ok = false; };
    set('f-nom', $('#f-nom').value.trim() ? '' : 'Indiquez votre nom.');
    set('f-veh', $('#f-veh').value.trim() ? '' : 'Indiquez la marque et le modèle.');
    const tel = $('#f-tel').value.trim(), mail = $('#f-mail').value.trim();
    set('f-tel', tel && digits(tel).length < 9 ? 'Numéro incomplet.' : '');
    set('f-mail', mail && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail) ? 'Adresse e-mail invalide.' : '');
    if (ok && !tel && !mail) set('f-tel', 'Laissez un téléphone ou un e-mail pour que je puisse vous répondre.');
    if (!ok){ const first = $('[aria-invalid="true"]', form); if (first) first.focus(); }
    return ok; };
  const dateFr = v => { try { return new Date(v + 'T12:00:00').toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' }); } catch(e){ return v; } };
  const message = () => { const g = n => (form.elements[n] ? form.elements[n].value.trim() : ''); const L = []; const add = x => { if (x !== '' || L[L.length - 1] !== '') L.push(x); };
    add('Bonjour Jermaine, je souhaite un devis.'); add('');
    add('Véhicule : ' + g('vehicule') + (E.actif ? ' (' + E.tailles[state.size].label + ', ' + E.etats[state.etat].label.toLowerCase() + ')' : ''));
    const r = compute(); if (r.lines.length){ add('Prestations :'); r.lines.forEach(l => add('- ' + l)); if (r.total) add('Estimation : environ ' + fmt(r.total)); }
    if (g('commune')) add('Commune : ' + g('commune'));
    if (g('date')) add('Date souhaitée : ' + dateFr(g('date')) + (g('moment') ? ' (' + g('moment').toLowerCase() + ')' : '')); else if (g('moment')) add('Moment souhaité : ' + g('moment').toLowerCase());
    if (g('message')){ add(''); add(g('message')); }
    add(''); add('Nom : ' + g('nom')); if (g('telephone')) add('Téléphone : ' + g('telephone')); if (g('email')) add('E-mail : ' + g('email'));
    return L.join('\n'); };
  const ok = txt => { const o = $('#formOk'); o.innerHTML = txt; o.classList.add('show'); o.scrollIntoView({ block:'nearest', behavior: reduceMotion ? 'auto' : 'smooth' }); };
  actions.addEventListener('click', e => { const b = e.target.closest('[data-send]'); if (!b) return; if (form.elements.website.value) return; if (!val()) return; const msg = message();
    if (b.dataset.send === 'wa'){ const wurl = 'https://wa.me/' + ci.wa + '?text=' + encodeURIComponent(msg); window.__lastSend = { kind:'wa', url:wurl, message:msg }; window.open(wurl, '_blank', 'noopener'); ok('<strong>WhatsApp s\'ouvre avec votre demande.</strong> Il ne reste qu\'à l\'envoyer.'); }
    else { const murl = 'mailto:' + ci.email + '?subject=' + encodeURIComponent('Demande de devis — ' + form.elements.vehicule.value.trim()) + '&body=' + encodeURIComponent(msg); window.__lastSend = { kind:'mail', url:murl, message:msg }; location.href = murl; ok('<strong>Votre application e-mail s\'ouvre avec votre demande.</strong> Il ne reste qu\'à l\'envoyer.'); } });
  form.addEventListener('submit', async e => { e.preventDefault(); if (form.elements.website.value) return; if (!val()) return; update();
    const btn = $('button[type=submit]', form); btn.disabled = true;
    try { const fd = new FormData(form); fd.set('recapitulatif', message()); window.__lastSend = { kind:'post', message:message() }; const res = await fetch(endpoint, { method:'POST', headers:{ 'Accept':'application/json' }, body:fd }); if (!res.ok) throw new Error(res.status);
      ok('<strong>Demande envoyée.</strong> Je reviens vers vous avec un devis et une date.'); form.reset(); try { sessionStorage.removeItem(FKEY); } catch(x){} state.sel.clear(); update(); }
    catch(err){ ok('<strong>L\'envoi a échoué.</strong> Réessayez, ou contactez-moi directement avec les coordonnées ci-dessus.'); }
    btn.disabled = false; });
  form.addEventListener('input', saveDraft);

  // ----- fiche contact (.vcf) -----
  const vb = $('#vcard'); if (vb) vb.onclick = () => {
    const tel = ci.tel.replace('tel:', ''); const url = str(C.seo && C.seo.siteUrl);
    const lines = ['BEGIN:VCARD', 'VERSION:3.0', 'FN:Pitlane Lab', 'ORG:Pitlane Lab', 'TITLE:Detailing automobile', tel && 'TEL;TYPE=CELL:' + tel, ci.email && 'EMAIL:' + ci.email, url && 'URL:' + url, 'NOTE:Detailing automobile sur place à Mantes-la-Jolie', 'END:VCARD'].filter(Boolean);
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([lines.join('\r\n')], { type:'text/vcard' })); a.download = 'pitlane-lab.vcf'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  };
  update();
}
