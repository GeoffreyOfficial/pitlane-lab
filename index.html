function initPolish(){
  const cv = $('#grime'), hero = $('#accueil'); if (!cv || !hero) return;
  const hint = $('#polishHint'), g = cv.getContext('2d'), hintTxt = hint && $('span', hint);
  let K = .5, W = 0, H = 0, lastW = 0, seen = null, count = 0, done = false, last = null, touched = false;
  const cols = 28, rows = 16;
  function paint(){
    const r = hero.getBoundingClientRect(); lastW = r.width;
    K = Math.max(.35, Math.min(.7, 780 / r.width)); W = Math.max(60, Math.round(r.width * K)); H = Math.max(60, Math.round(r.height * K)); const u = K * 2;
    cv.width = W; cv.height = H; seen = new Uint8Array(cols * rows); count = 0; last = null;
    let s = 11; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, W, H);
    g.fillStyle = 'rgba(120,128,142,.15)'; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 26; i++){ const x = rnd() * W, y = rnd() * H, rr = (.08 + rnd() * .22) * W; const gr = g.createRadialGradient(x, y, 0, x, y, rr); gr.addColorStop(0, 'rgba(150,140,125,' + (.04 + rnd() * .07) + ')'); gr.addColorStop(1, 'rgba(150,140,125,0)'); g.fillStyle = gr; g.fillRect(x - rr, y - rr, rr * 2, rr * 2); }
    for (let i = 0; i < 34; i++){ const x = rnd() * W, y = rnd() * H * .8, w = (.5 + rnd() * 1.4) * u, h = (.1 + rnd() * .5) * H; const gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, 'rgba(215,225,238,0)'); gr.addColorStop(.3, 'rgba(215,225,238,' + (.035 + rnd() * .07) + ')'); gr.addColorStop(1, 'rgba(215,225,238,0)'); g.fillStyle = gr; g.fillRect(x, y, w, h); }
    g.lineCap = 'round';
    for (let i = 0; i < 300; i++){ const cx = rnd() * W, cy = rnd() * H, rr = (6 + rnd() * 120) * u, a0 = rnd() * 6.28, len = .6 + rnd() * 1.8; g.strokeStyle = 'rgba(205,215,232,' + (.025 + rnd() * .075) + ')'; g.lineWidth = Math.max(.5, (.4 + rnd() * .6) * u); g.beginPath(); g.arc(cx, cy, rr, a0, a0 + len); g.stroke(); }
    for (let i = 0; i < 1100; i++){ const x = rnd() * W, y = rnd() * H, rr = (.5 + rnd() * 1.3) * u; g.fillStyle = rnd() > .45 ? 'rgba(170,158,140,' + (.08 + rnd() * .18) + ')' : 'rgba(255,255,255,' + (.05 + rnd() * .13) + ')'; g.beginPath(); g.arc(x, y, rr, 0, 6.28); g.fill(); }
    for (let i = 0; i < 28; i++){ const x = rnd() * W, y = rnd() * H, rr = (2.5 + rnd() * 6) * u; g.fillStyle = 'rgba(255,255,255,.035)'; g.strokeStyle = 'rgba(255,255,255,.11)'; g.lineWidth = Math.max(.6, u * .9); g.beginPath(); g.arc(x, y, rr, 0, 6.28); g.fill(); g.stroke(); }
  }
  function stamp(x, y){
    const R = 66 * K; g.globalCompositeOperation = 'destination-out';
    const gr = g.createRadialGradient(x, y, R * .2, x, y, R); gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - R, y - R, R * 2, R * 2);
    const x0 = Math.max(0, Math.floor((x - R * .7) / W * cols)), x1 = Math.min(cols - 1, Math.floor((x + R * .7) / W * cols)), y0 = Math.max(0, Math.floor((y - R * .7) / H * rows)), y1 = Math.min(rows - 1, Math.floor((y + R * .7) / H * rows));
    for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++){ const k = cy * cols + cx; if (!seen[k]){ seen[k] = 1; count++; } }
  }
  function stampTo(x, y){
    if (done) return; if (!last){ stamp(x, y); last = [x, y]; return; }
    const dx = x - last[0], dy = y - last[1], dist = Math.hypot(dx, dy), step = 66 * K * .3, n = Math.max(1, Math.ceil(dist / step));
    for (let i = 1; i <= n; i++) stamp(last[0] + dx * i / n, last[1] + dy * i / n);
    last = [x, y]; if (count / (cols * rows) > .6) finish();
  }
  function finish(){
    if (done) return; done = true; cv.classList.add('gone'); hero.classList.add('polished');
    if (hint){ hintTxt.textContent = 'Brillant.'; hint.classList.add('show'); setTimeout(() => hint.classList.remove('show'), 2400); }
    setTimeout(() => { if (cv.parentNode) cv.remove(); }, 1700);
  }
  function showHint(){ if (!hint || touched || done) return; hintTxt.textContent = isTouch ? 'Passe le doigt pour polir' : 'Passe la souris pour polir'; hint.classList.add('show'); setTimeout(() => hint.classList.remove('show'), 7000); }
  function move(cx, cy){ if (done) return; const r = hero.getBoundingClientRect(); if (cy < r.top || cy > r.bottom) { last = null; return; } if (!touched){ touched = true; if (hint) hint.classList.remove('show'); } stampTo((cx - r.left) * K, (cy - r.top) * K); }
  function demo(){
    if (touched || done) return; const t0 = performance.now(), dur = 1500;
    const step = t => { if (touched || done) return; const k = Math.min(1, (t - t0) / dur); stampTo(W * (-.05 + 1.1 * k), H * (.66 + .05 * Math.sin(k * 13))); if (k < 1) requestAnimationFrame(step); else { last = null; showHint(); } };

  }

  hero.addEventListener('pointermove', e => { if (e.pointerType !== 'touch') move(e.clientX, e.clientY); }, { passive:true });
  hero.addEventListener('touchmove', e => { const t = e.touches[0]; if (t) move(t.clientX, t.clientY); }, { passive:true });

  hero.addEventListener('pointerleave', () => { last = null; });
  if ('ResizeObserver' in window){ let to; new ResizeObserver(() => { clearTimeout(to); to = setTimeout(() => { if (!done && Math.abs(hero.getBoundingClientRect().width - lastW) > 40) paint(); }, 250); }).observe(hero); }
  onIntroDone(() => setTimeout(demo, 800));
}

   DÉMARRAGE
   ===================================================================== */
/* aperçu en direct dans l'admin : le contenu est renvoyé à chaque réglage, sans recharger la page */
if (window.__PREVIEW) window.addEventListener('message', e => { const d = e.data; if (d && d.type === 'pl-content' && d.content && C){ C = d.content; const y = window.scrollY; try { render(); } catch(err){ console.error(err); } window.scrollTo(0, y); } });
initChrome();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.__PREVIEW) addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
loadContent().then(data => { C = data; render(); }).catch(err => {
  const isFile = location.protocol === 'file:';
  $('#app').innerHTML = `<div class="wrap" style="padding:9rem 0 6rem"><h1 class="h2">Le site n'a pas pu se charger.</h1><p class="lead">${isFile ? 'Ouvrez le site depuis un serveur web (ou un hébergement) : un fichier ouvert directement ne peut pas lire content.json.' : 'Vérifiez votre connexion puis rechargez la page.'}</p><p><button class="btn" onclick="location.reload()">Recharger</button></p></div>`;
  console.error(err);
});
})();
</script>
</body>
</html>
